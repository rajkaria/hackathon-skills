<script type="application/json" id="__NUXT_DATA__" data-ssr="true" nonce="e4SEdg6uTvyO3i80Geak7Q==">[["Reactive",1],{"data":2,"state":6,"_errors":8,"serverRendered":10,"path":11,"pinia":12},{"$c6Qfj6tyAL":-1,"$IZnG9Yswxw":3},{"buidl":4},["Model",5],"{\"schema\":\"BUIDL\",\"d\":{\"id\":46441,\"owner\":333850,\"ownerInfo\":{\"username\":\"U_4a1cf89c7aa632\",\"nickName\":\"Mr.ooo\",\"avatarUrl\":\"https://cdn.dorahacks.io/static/files/19e86769b9b9657e7dece374af587480.jpeg\"},\"lastEditor\":{\"id\":333850,\"username\":\"U_4a1cf89c7aa632\",\"nickName\":\"Mr.ooo\"},\"name\":\"Faktura\",\"vision\":\"Faktura is the autonomous invoice-financing desk on Casper. An AI agent underwrites real-world invoices; a native-CSPR pool funds them; and every AI decision is hash-anchored on-chain, making autonomous underwriting auditable. Agentic AI x DeFi x RWA.\",\"description\":\"# Faktura — the autonomous RWA credit desk on Casper\\n\\n> **The AI approved the invoice. The contract said no — here's the receipt:**\\n> [`830ebd77…`](https://testnet.cspr.live/transaction/830ebd775835ffdeba1122b99695a0bf589de442f80d1c31c1d43c4e7039aaea)\\n> `fund_invoice` REVERTED with `User error: 15 (SingleInvoiceCapExceeded)` — a\\n> valid agent key carrying a genuine AI approval, stopped by the on-chain risk\\n> policy. **AI underwrites. Casper decides. Suppliers get paid.**\\n>\\n> You can reproduce that revert yourself, on demand, at\\n> **[faktura.axiqo.xyz](https://faktura.axiqo.xyz)** — no wallet signature, no\\n> terminal, no faith required.\\n\\nFaktura turns unpaid invoices (a ~$3T real-world market) into working capital:\\nan autonomous AI agent underwrites each receivable, a Casper contract enforces\\nhard risk limits the model cannot cross, a native-CSPR pool pays the supplier,\\nand every decision — approvals AND rejections — is hash-anchored on-chain.\\n\\n---\\n\\n## 🧪 Test it yourself in 6 clicks (no terminal, no marketing)\\n\\n**Five guided stories** — full lifecycle, policy firewall, x402 (buy → verify → act), AI declines, default workout — every one driven by you, on the real chain.\\n\\n1. Open **https://faktura.axiqo.xyz** and click **▶ Use the real AI desk**.\\n2. *(Optional but fun)* **Connect Casper Wallet** — read-only, public key only.\\n   The desk pays the invoice advance **to your own testnet address**. Our demos\\n   never ask your wallet to sign anything — the desk pays YOU.\\n3. Click through the walkthrough: **each click signs exactly one real Casper\\n   Testnet transaction** (live finality timer), then shows its CSPR.live link.\\n   Every screen says what happened, why it matters, and what's next.\\n4. Run **⛔ Watch the AI get blocked**: the AI approves an oversized invoice and\\n   `fund_invoice` reverts on-chain with `User error: 15` — in front of you.\\n5. Run **AI declines** and **Default workout**: bad paper is rejected and the\\n   rejection memo is anchored (`UNDERWRITE_REJECT`); an overdue invoice is\\n   written off by the COLLECTOR key — LPs absorb the loss. Credit has two\\n   endings, and the desk processes both.\\n6. Expand **Related MCP capability** under any step (or the **MCP · 6 tools**\\n   chip) to drive the same desk from your own agent.\\n\\nAnti-abuse: payouts are budget-reserved (1 per wallet & IP / 24 h, global\\ndaily CSPR cap), all signing is rate-limited and gas-budgeted, abandoned runs\\nare auto-settled by a cleanup worker, sessions are token-guarded.\\n\\n---\\n\\n## ✅ Everything is real (live judge mode)\\n\\n| Feature | Status | Proof |\\n|---|---|---|\\n| AI underwriting (LLM inference, scored + priced + rationale) | **Real** | decision hash anchored per run |\\n| `register_invoice` on Casper Testnet | **Real** | [`6c0bc0eb…`](https://testnet.cspr.live/deploy/6c0bc0ebda991e9de45817f717f9985e676618cd19493b580763de2a10edaadc) |\\n| `fund_invoice` — pool pays the supplier | **Real** | [`a1640661…`](https://testnet.cspr.live/deploy/a164066156dee02d7444e3895031dc5861377fe14ea1167ef6197810ff6c3d6b) |\\n| Policy firewall — contract rejects an AI-approved invoice | **Real revert** | [`830ebd77…`](https://testnet.cspr.live/transaction/830ebd775835ffdeba1122b99695a0bf589de442f80d1c31c1d43c4e7039aaea) + reproduce live |\\n| Payout to the judge's own wallet (ed25519 `01…` & secp256k1 `02…`) | **Real** | ed25519 [`a1640661…`](https://testnet.cspr.live/deploy/a164066156dee02d7444e3895031dc5861377fe14ea1167ef6197810ff6c3d6b) · secp256k1 [`4a1d85f9…`](https://testnet.cspr.live/deploy/4a1d85f9b178958b4016d314d3ba1a4319b19438807371abb5e56d8ad8612ad5) |\\n| x402 machine payment (HTTP 402 → native CSPR settlement → verified report) | **Real** | [`bbba64e6…`](https://testnet.cspr.live/deploy/bbba64e663e89fcbe847e81905b5273a5e1814ae6cf9cc92477aef4ccdd4b9e9) |\\n| x402 buyer ACTS on the report (verifies memo hash, anchors `CREDIT_REPORT_ACCEPTED`) | **Real** | [`075ff462…`](https://testnet.cspr.live/deploy/075ff462106fd0864b017e6e6ba224eec0f5a6f788376a3be885e96e98c8542e) |\\n| Default workout — collector writes off an overdue invoice, LPs absorb the loss | **Real** | [`c9d24e8c…`](https://testnet.cspr.live/deploy/c9d24e8cadd054c2ab9fcfae582cb144816996fb828cfea60289a4291412deb6) |\\n| The revert YOU trigger links itself (not just a canonical example) | **Real** | [`269a3e22…`](https://testnet.cspr.live/transaction/269a3e223b8ee3c003488dd59636fd19f22744fc655571310858bfac6baf1166) |\\n| AI-decision attestation log (approvals AND rejections) | **Real** | [`8099c8ea…`](https://testnet.cspr.live/deploy/8099c8ea425dead0dfdcdbdc85e3e2eb74500e3fd3f3415b50cd6612a254d381) |\\n| Autonomous collector write-off (separate key, `mark_default` only) | **Real** | [`f6b3b746…`](https://testnet.cspr.live/deploy/f6b3b7469ed26e08f7f560b4b93cf3d3f792d03029396f23a84e388d7f4d6930) |\\n| AI declines anchored (`UNDERWRITE_REJECT` — even the NO is auditable) | **Real** | attestation on-chain, memo hash covers every red flag |\\n| Verifiable credit receipts (`faktura.credit-receipt.v1`, `npm run verify-receipt -- file --online` re-checks every tx against the node RPC) | **Real** | production receipt verifies |\\n| MCP server (6 tools, drives the same pipeline) | **Real** | in-UI live previews |\\n| Domain + HTTPS production deployment | **Real** | faktura.axiqo.xyz (HTTP/2, HSTS) |\\n\\nThe always-on **safe showcase** (simulated writes so casual visitors don't burn\\ngas) is clearly labeled and never explorer-linked — and the guided **Live\\nJudge Mode** above signs everything for real.\\n\\n---\\n\\n## 🔒 Security model (a public endpoint that signs real value)\\n\\n- The contract enforces risk ceiling, discount band, single-invoice cap and\\n  per-debtor exposure cap **inside** `register_invoice`/`fund_invoice` — a\\n  buggy prompt or compromised agent key still can't exceed them (typed errors,\\n  12 Odra tests incl. the compromised-key scenario).\\n- Five persona keys, least privilege: the underwriter cannot write off\\n  defaults; the collector can do *only* that.\\n- Wallet connect is read-only (public key → account-hash via the SDK).\\n- Payout budget is **reserved before signing** (atomic ledger, fail-closed),\\n  per-wallet/per-IP/daily caps, global gas budget, one active session, token\\n  bearer on every mutation, CORS allow-list, trust-proxy IP handling.\\n- Timeout recovery reconciles on-chain state before any retry — one click can\\n  never double-sign; idle funded runs are auto-settled.\\n\\n## 🤖 What makes it agentic\\n\\nThree autonomous roles run with no human in the loop: the **underwriter agent**\\n(pre-checks → LLM risk/price → register/fund/attest), the **collector agent**\\n(reconciles settlements, writes off past-due invoices), and the **x402 risk\\noracle** (sells each underwriting as a machine-payable report over HTTP 402\\nwith native-CSPR settlement). An **MCP server** exposes the whole desk to any\\nagent — six tools: `pool_stats`, `submit_invoice`, `get_risk_report`,\\n`list_funded_invoices`, `list_verified_invoices`, `verify_decision_hash` — the\\nlast one re-hashes the FULL decision memo and compares it to the on-chain\\nanchor, so *anyone's agent can audit ours*.\\n\\n## ⛓ Why Casper, why now\\n\\nMachine commerce is arriving (x402 is becoming an ecosystem standard), and the\\nquestion is no longer \\\"can an AI move money?\\\" but \\\"**what stops it when it's\\nwrong?**\\\" Faktura's answer is Casper: policy limits and decision anchors\\nenforced by the chain itself, cheap enough to attest every decision, with\\nnative-CSPR settlement for machine-to-machine payments.\\n\\n## 📦 Verify everything yourself\\n\\n- **Live guided walkthrough**: https://faktura.axiqo.xyz\\n- **Evidence pack** (every claim = a tx link): [DORAHACKS.md](https://github.com/a252937166/faktura-casper/blob/master/DORAHACKS.md)\\n- **Contract package**: [`fb209bb1…`](https://testnet.cspr.live/contract-package/fb209bb1d3a1d5e675841f7d184ab7fa96d65adc099f6fd0105f29115fb49d7e)\\n- **Repo + CI (fmt/clippy/tests/build)**: https://github.com/a252937166/faktura-casper\\n- **Final release**: [`v0.2.4-final`](https://github.com/a252937166/faktura-casper/releases/tag/v0.2.4-final) — build 2b76e3f, 58/58 tests, CI + CodeQL green\\n- **Demo video** (3 min, every on-chain step a real Testnet tx): https://youtu.be/Omidi47zryc\\n- **MCP in one command**: `cd agents && npm i && FAKTURA_API=https://faktura.axiqo.xyz npm run mcp`\\n- **Verify a receipt offline/online**: download any walkthrough's receipt JSON, then `npm run verify-receipt -- receipt.json --online`\\n\\n## 🧭 Honest scope & roadmap\\n\\nTestnet-only demo keys and small caps by design; the LP pool, policy and\\nlifecycle are the real mechanism. Next: permissioned institutional pools,\\nsupplier-ERP document ingestion with proof-of-authenticity, facilitator-mode\\nx402 at scale, and the MCP surface as distribution — other agents underwrite\\n*with* Faktura instead of rebuilding it.\\n\\n## 🏁 Judging criteria, mapped\\n\\n- **Working smart contracts on Testnet** — deployed, exercised, and\\n  re-exercisable by you, one click per transaction.\\n- **AI/agentic** — the agents run the entire credit process; attestations +\\n  on-chain policy make each autonomous decision provable *and* bounded.\\n- **Real-world applicability** — invoice factoring is a live $3T market; pool,\\n  yield and RWA lifecycle are the actual mechanism, not a metaphor.\\n- **Long-term plan** — see roadmap; the x402/MCP surfaces are the distribution\\n  channel for the agent economy.\",\"imageUrl\":\"https://cdn.dorahacks.io/static/files/19f2c13411f552aacb483264543811ae.png\",\"teamDescription\":\"Solo builder. Designed, built, deployed and shipped Faktura end-to-end for the Casper Agentic Buildathon: the Odra/Rust smart contract (RWA registry, native-CSPR pool, on-chain AI attestations), the TypeScript autonomous agents (AI underwriter, collector, x402 risk oracle), and the live React dashboard hosted at https://faktura.axiqo.xyz.\",\"githubUrl\":\"https://github.com/a252937166/faktura-casper\",\"demoUrl\":\"https://faktura.axiqo.xyz\",\"demoVideoUrl\":\"https://youtu.be/Omidi47zryc\",\"otherInfrastructures\":[],\"ownerTitle\":null,\"ownerIntroduction\":null,\"socialUrls\":[\"https://github.com/a252937166\"],\"techTrees\":[0],\"infrastructureTags\":[71,114,132,287],\"reviewStatus\":1,\"isPrivate\":false,\"isDeleted\":false,\"isArchived\":false,\"editTime\":1784553289,\"createdAt\":\"2026-07-03T22:08:21.561744\",\"updatedAt\":\"2026-07-20T21:14:49.743693\",\"bookmarks\":0,\"members\":[],\"upvoted\":false,\"bookmarked\":false,\"upvoters\":{\"count\":0,\"list\":[]},\"ideas\":[],\"openGraphUrl\":\"https://cdn.dorahacks.io/static/open-graph/6c393a4512c643d49540361af56cdbe5.png\"}}",{"$sglobal-maintenance-now":7},1789571454683,{"$c6Qfj6tyAL":9,"$IZnG9Yswxw":9},null,true,"/buidl/46441",{"user":13,"global":15,"mailbox":19},{"me":9,"token":14},"",{"innerWidth":16,"oriPath":11,"oriFullPath":11,"githubClientID":17,"googleClientID":14,"linkedinClientID":14,"historyGlobalSearches":18},160
