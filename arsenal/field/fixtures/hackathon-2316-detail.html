<script type="application/json" id="__NUXT_DATA__" data-ssr="true" nonce="ucV7OYCnrhasMU1lT2fkuA==">[["Reactive",1],{"data":2,"state":9,"_errors":11,"serverRendered":4,"path":12,"pinia":13},{"$c6Qfj6tyAL":-1,"hackathon-page-casper-agentic-buildathon-finals":3},{"passwordValidateStatus":4,"hackathon":5,"hackathonInfo":7,"winnerAssignment":7,"bountyPrizes":8},true,["Model",6],"{\"schema\":\"HACKATHON\",\"d\":{\"id\":2316,\"uname\":\"casper-agentic-buildathon-finals\",\"title\":\"Casper Agentic Buildathon 2026 - Final Round\",\"imageUrl\":\"https://cdn.dorahacks.io/static/files/19f5c0a0f1bc1f46f2bdc404380b0f69.png\",\"ecosystem\":\"Casper,Casper Network,x402,AI\",\"tags\":\"Casper,Agentic,Blockchain,Web3,AI Agents,DeFi,Real-World Assets\",\"visibility\":0,\"owner\":{\"id\":6110,\"name\":\"Casper Network\",\"logo\":\"https://cdn.dorahacks.io/static/files/19a2983986c815c9ae1852f4130b5099.png\"},\"timelineStart\":1783900800,\"timelineEnd\":1785110340,\"timelinePreRegister\":0,\"timelineOldEnd\":null,\"isExtended\":false,\"venueForm\":\"Virtual\",\"venueCountryId\":null,\"venueCityId\":null,\"venueName\":null,\"venueAddress\":null,\"bonusPrice\":150000,\"bonusToken\":\"USD\",\"bonusDescription\":[],\"buidlsCount\":116,\"winnerAnnounced\":true,\"weight\":0,\"description\":\"# Casper Agentic Buildathon 2026 - Final Round\\n\\n## Activity Introduction\\n\\nWelcome to the **Casper Agentic Buildathon 2026 - Final Round**, hosted by the Casper Association—a global online competition designed to attract, onboard, and empower the next generation of Web3/AI developers. Running from June 1 to June 30, 2026, with a hands-on developer workshop in Istanbul on June 2 during Istanbul Blockchain Week, this buildathon invites builders from all backgrounds to create production-ready applications at the convergence of **Agentic AI**, **Decentralized Finance (DeFi)**, and **Real-World Assets (RWA)** on the Casper Network.\\n\\n### Positioning\\n\\nThe Casper Agentic Buildathon is open to everyone—solo hackers, seasoned teams, students, and entrepreneurs—who are passionate about building real, working applications powered by Agentic AI and deployed on Casper.\\n\\n### Overall Goal\\n\\nOnboard developers to the Casper ecosystem at scale, accelerate the creation of usable, real-world dApps, position Casper at the intersection of DeFi, RWA, and AI innovation, demonstrate decentralized participation through community voting on the CSPR.fans app, and expand global awareness of Casper among builders, partners, and media.\\n\\n# Prize Pool\\n\\n| Category | Amount |\\n|----------|--------|\\n| **Total Prize Pool** | $150,000 USD |\\n| Cash Prizes | $30,000 USD |\\n| x402 Ecosystem Credits | $100,000 USD |\\n| In-kind Rewards from Co-Sponsors | $20,000 USD |\\n\\nBeyond financial prizes, winning teams will receive recognition and ecosystem support, including technical mentorship, marketing and ecosystem amplification, and potential grant and incubation opportunities within Casper.\\n\\n# Notable Features\\n\\n- **One unified track:** Casper Innovation Track\\n- **Two-phase structure:** Qualification Round (community voting + prototype-based qualification) followed by Final Round (professional jury evaluation)\\n- **Top 3 community-voted projects** advance to finals without additional judging\\n- **All other projects** must meet technical eligibility criteria to advance\\n- **In-person developer immersion** during Istanbul Blockchain Week (June 2)\\n- **Open-source, public submissions** to drive transparency and collaboration\\n- **Global participation** with no team size restrictions\\n\\n---\\n\\n# Time Schedule\\n\\n| Date | Event |\\n|------|-------|\\n| **June 1, 2026** | Online buildathon officially launches—Qualification Round begins! |\\n| **June 2, 2026** | In-person developer workshop and networking at Istanbul Blockchain Week |\\n| J**uly 07, 2026** | Qualification Round submission deadline |\\n| **July 8-12, 2026** | Qualification Round evaluations and finalist selection |\\n| **July 13-26, 2026** | Final Round (2 weeks) |\\n| **End of July 2026** | Final judging, demo day presentations, and winner announcements |\\n\\n---\\n\\n# Support and Partners\\n\\n| Role | Organization |\\n|------|--------------|\\n| **Organizer** | Casper Association |\\n| **Platform Partner** | DoraHacks |\\n| **Event Partner** | Istanbul Blockchain Week |\\n\\n# Mentors and Judges\\n\\nThe professional jury panel comprises Casper Association leadership and technical experts, representatives from partner organizations, Web3 investors, ecosystem leaders, and media representatives.\\n\\nCasper and DoraHacks will provide technical resources, mentorship, and support channels to help teams build and deploy on Testnet with confidence.\\n\\n---\\n\\n# Submission Method and Rules\\n\\n### Registration\\n\\nSign up via DoraHacks with your team or as a solo participant. No pre-qualification materials required.\\n\\n### Submission Requirements\\n\\nEach project must include:\\n\\n1. **Working prototype** deployed on Casper Testnet with a **transaction-producing on-chain component**\\n2. **Open-source GitHub repository** (must include a README with documentation and usage instructions)\\n3. **Demo video** (public video explaining the project, features, and a walkthrough)\\n\\n### Qualification Round Selection Mechanism\\n\\nThe Qualification Round uses a hybrid advancement mechanism:\\n\\n**Community Voting Path:**\\nThe top 3 projects receiving the most votes via the **CSPR.fans app** advance directly to the Final Round **without additional judging**.\\n\\n**Builder Merit Path (Prototype-Based Qualification):**\\nAll other projects must meet the technical eligibility criteria (working prototype on Casper Testnet with transaction-producing on-chain component) to advance to the Final Round for professional jury evaluation.\\n\\n### Eligibility Criteria\\n\\n- Teams of any size or solo builders welcome\\n- All code and content must be original and newly developed for the Buildathon\\n- **Focus:** Agentic AI applications, with particular emphasis on DeFi and/or real-world assets (RWA) on Casper\\n\\n### Final Round Judging Criteria\\n\\nProjects advancing to the Final Round will be evaluated on:\\n\\n| Criterion | Description |\\n|-----------|-------------|\\n| **Technical Execution** | Code quality, architecture, and implementation completeness |\\n| **Innovation & Originality** | Novelty of approach, technology, and ideas |\\n| **Use of AI / Agentic Systems** | Meaningful integration of AI agents and autonomous systems |\\n| **Real-World Applicability** | Usefulness and relevance, especially in DeFi & RWA contexts |\\n| **User Experience & Design** | Quality of interface and user interactions |\\n| **Working Smart Contracts** | Functional, deployed contracts on Casper Testnet |\\n| **Long-Term Launch Plans** | Real project with socials in place and actual deployment plans |\\n| **Potential for Long-Term Impact** | Contribution to Casper ecosystem growth and adoption |\\n\\n### Code of Conduct\\n\\nAll participants must adhere to fair play, originality, and anti-plagiarism standards. All participants must adhere to the Casper Network Code of Conduct and treat other participants, organizers, and judges with respect. Projects breaching these standards may be disqualified from either round.\\n\\n---\\n\\n# Developer Enablement\\n\\n### Hands-On Workshop at Istanbul Blockchain Week (June 2)\\n\\nThe developer workshop will cover:\\n\\n- Introduction to Casper architecture\\n- Smart contract development / Odra\\n- CSPR Tooling and SDKs\\n- Best practices for building scalable dApps\\n- Agentic workflows and solutions\\n- Quick look at the Casper AI Toolkit\\n- Working with AI for building onchain solutions\\n\\n### Ongoing Support\\n\\n- **Documentation, tutorials,** and ongoing ecosystem support\\n- **Technical mentorship** from Casper experts\\n- **Marketing and ecosystem amplification** for winning teams\\n- **Potential grant and incubation opportunities** within Casper\\n\\n### AI Toolkit & Developer Resources\\n\\nCasper provides a comprehensive AI Toolkit designed specifically for agentic development. Access the full toolkit at [https://www.casper.network/ai](https://www.casper.network/ai), featuring production-ready components including:\\n\\n•**x402 Micropayments**: HTTP-native payment protocol enabling agents to pay per API request with cryptographic proof\\n\\n•**MCP Servers**: Model Context Protocol servers (Casper MCP Server, CSPR.trade MCP) providing direct blockchain access for queries, trades, and portfolio management\\n\\n•**CSPR.click AI Agent Skill**: Installable coding skill for wallet creation, transaction signing, and CSPR.cloud API access\\n\\n•**CSPR.cloud APIs**: Enterprise-grade middleware with REST, Streaming, and Node API layers for blockchain interaction at scale\\n\\n•**Odra Framework**: Developer-friendly smart contract framework with llms.txt support, enabling AI agents to generate and deploy working Casper contracts autonomously\\n\\nDevelopers can also reference the **Casper Manifest** for the strategic vision of Casper as the trust layer for the agent economy.\\n\\n---\\n\\n# Vision and Call to Action\\n\\nThe Casper Agentic Buildathon 2026 is more than a hackathon—it's a movement to empower developers to build practical, impactful AI agents for the decentralized world. We believe that the fusion of autonomous AI with DeFi and RWA will unlock new economic possibilities and help shape the next era of open, trustless innovation. Whether you're an AI enthusiast, blockchain developer, entrepreneur, or simply curious, your creativity and ambition are welcome here!\\n\\n**Let's make Casper the home of the next generation of agentic, decentralized applications. Join us and leave your mark on Web3!**\\n\\n---\\n\\n# Frequently Asked Questions\\n\\n### How do I access the Casper Testnet?\\n\\nFull onboarding resources will be available within the first days of the Buildathon, including documentation, and live support.\\n\\n### What is Agentic AI?\\n\\nAgentic AI refers to autonomous AI agents that can perceive their environment, make decisions, and take actions independently. In the context of this buildathon, participants will build agents that harness AI Agent Skills, Model Context Protocols (MCPs), and the X402 standard to enable autonomous agents to reliably connect wallets, sign transactions, manage assets, and interact with smart contracts on the Casper Network.\\n\\n### Can I participate remotely?\\n\\nYes! All core buildathon activities are online; the Istanbul Blockchain Week workshop (June 2) is optional but highly encouraged for those who can attend.\\n\\n### Where will updates be posted?\\n\\nOfficial communications will be shared via DoraHacks, Casper Developer channels, and event partners. Join our Discord/Telegram for the latest announcements:\\n\\n- [Casper Developers group on Telegram](https://t.me/CSPRDevelopers)\\n- [Casper Discord Server](https://discord.com/invite/caspernetwork)\\n\\n### What AI tools and frameworks does Casper provide for builders?\\n\\nCasper offers a complete AI Toolkit tailored for agentic development. Visit [https://www.casper.network/ai](https://www.casper.network/ai) to explore:\\n\\n•**MCP Servers** for blockchain queries and decentralized exchange operations\\n\\n•**Agent Skills** for wallet management, transaction signing, and event handling\\n\\n•**x402 Protocol** for automated micropayments between agents and services\\n\\n•**Odra Framework** with AI-discoverable documentation for smart contract generation\\n\\n•**CSPR.cloud** middleware for enterprise-grade blockchain interaction\\n\\nThese tools enable builders to create autonomous DeFi agents, pay-per-request APIs, AI-powered dApps, and machine-to-machine commerce systems on Casper.\\n\\n### What are the example build directions?\\n\\nParticipants can build applications such as:\\n\\n**1. Autonomous Yield-Routing Agents via MCP**\\nBuild an autonomous agent that actively monitors yield opportunities across Casper DeFi protocols. The agent uses Model Context Protocol (MCP) servers to expose Casper smart contract states to an AI LLM. The AI Agent Skill naively signs transactions and reallocates funds when yield thresholds are met, transforming a passive wallet into an active, self-driving portfolio manager.\\n\\n**2. RWA Oracle Agents with Verifiable On-Chain Identity**\\nCreate an agent that scrapes off-chain data, runs a risk assessment model, and posts verified data on-chain via Casper's native X402 implementation (launching June 2026). The agent maintains a verifiable on-chain identity and reputation score based on historical accuracy, creating a trust-minimized RWA oracle.\\n\\n**3. Multi-Agent DAO Governance & Execution**\\nDesign a system where a swarm of specialized agents (Risk Agent, Treasury Agent, Legal Agent) deliberate on DAO proposals and use the Casper SDK to autonomously execute transactions. This demonstrates autonomous coordination on-chain.\\n\\n**4. AI-Driven Compliance & KYC via Zero-Knowledge**\\nBuild an agentic workflow handling KYC/AML compliance for DeFi protocols. The agent processes user documents off-chain, verifies them, and issues a compliance token. Using Casper's upgradable smart contracts, the agent can autonomously revoke or update compliance statuses based on continuous off-chain monitoring, without exposing underlying user data on-chain.\\n\\n---\\n\\n# Developer Resources\\n\\n- [Casper AI Toolkit](https://www.casper.network/ai)\\n- [GitHub Repositories](https://github.com/casper-network)\\n- [Developer Docs](https://docs.casper.network)\\n\\n# Contact & Support\\n\\nFor additional questions, visit our event FAQ or reach out on community channels. Let's build the future—together!\",\"mandatoryGitRepoLink\":true,\"mandatoryVideoLink\":true,\"isEnabledSubmissionForm\":true,\"submissionForm\":\"[{\\\"id\\\":1,\\\"question\\\":\\\"Casper Testnet Contract Address(es)\\\",\\\"required\\\":true},{\\\"id\\\":2,\\\"question\\\":\\\"Technology Stack Used$mode:multiple$option:Odra Framework$option:Native Casper Rust SDK$option:CSPR.click$option:CSPR.cloud$option:JavaScript/TypeScript SDK$option:Python SDK$option:x402 Facilitator$option:Casper MCP Server$option:CSPR.click AI Agent Skill$option:CSPR.cloud AI Agent Skill\\\",\\\"required\\\":false}]\",\"isMultiTracksAllowed\":false,\"tracksLimitForBuidl\":0,\"isEnableBounty\":false,\"isBountyRequired\":false,\"bountiesLimitForBuidl\":10,\"registerFormUrl\":null,\"isEnabledRegistrationForm\":true,\"registrationForm\":[{\"id\":1,\"question\":\"Have you built on Casper before?$mode:single$option:Yes$option:No\",\"required\":false},{\"id\":2,\"question\":\"Discord Username\",\"required\":true},{\"id\":3,\"question\":\"Telegram Username\",\"required\":true},{\"id\":4,\"question\":\"Contact email\",\"required\":true}],\"showQaTab\":true,\"showTracksTab\":true,\"showTeamTab\":true,\"hideBuildsTab\":false,\"showAnnouncements\":false,\"enableWhitelist\":true,\"tabs\":[],\"publicContactHackerHandle\":\"kara\",\"hackersCount\":219,\"teamCount\":2,\"roleCount\":7,\"isArchived\":false,\"isPublished\":true,\"approvalStatus\":6,\"password\":null,\"enabledAutoReply\":false,\"internalContacts\":null,\"tracks\":[{\"id\":4561,\"name\":\"Casper Innovation Track\",\"description\":\"Participants will build applications that leverage Casper's infrastructure to unlock new financial use cases by combining Artificial Intelligence (with strong emphasis on Agentic AI), Decentralized Finance (DeFi), and Real-World Assets (RWA).\\n\\nWhile we particularly encourage projects that demonstrate the power of Agentic AI in solving real-world problems, all well-designed, functional applications that contribute to the Casper ecosystem are welcome.\"}],\"bountiesCount\":0,\"isOrganizer\":false,\"isAdmin\":false,\"isCollaborator\":false,\"isTrackJudge\":false,\"isBountyJudge\":false,\"tracksCount\
